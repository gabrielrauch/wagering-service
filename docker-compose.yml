# The whole service and everything it talks to, on one laptop.
#
#   docker compose up --build       bring it all up
#   docker compose down -v          take it all down, volume included
#
# `make up` and `make down` are the same two commands with the waiting done for
# you. What comes up:
#
#   postgres     5432   the database, migrated by the job below before anything
#                       that needs a schema starts
#   keycloak     8080   the identity provider, realm imported from deploy/
#   localstack   4566   SQS, queues provisioned from deploy/
#   api-1        8081   three API replicas on three host ports
#   api-2        8082
#   api-3        8083
#   worker        --    two replicas, publishing no host port: nothing calls
#                       a worker. It is the process that hosts the outbox
#                       publisher, the consumer and the reference loop.
#
# and the observability stack, which the five service processes reach through
# one address and nothing else:
#
#   otel-collector  4317  OTLP in, from every API replica and every worker
#   tempo           3200  the traces
#   prometheus      9090  the metrics, scraped back off the collector
#   grafana         3000  both of those, dashboard already loaded
#
# Configuration is written here rather than read from .env.example, and the two
# disagree on purpose. .env.example is the host's view — `localhost:5432`,
# `localhost:8080` — because that is where a developer running `go run ./cmd/api`
# finds these services. In here every address is a service name on the compose
# network instead. Every variable that is not named below is left at the default
# .env.example documents, so there is one place to read what a variable means
# and one place to read what this stack sets it to.
#
# No secret in this file is real. The database password, the Keycloak admin
# password and the AWS credentials are placeholders that only these containers
# will ever accept.
name: wagering

# ---------------------------------------------------------------------------
# The observability path
#
#   api-1..3, worker ──OTLP/gRPC──▶ otel-collector ──▶ tempo      traces
#                                         │
#                                      :8889 ◀──scrape── prometheus   metrics
#                                                             │
#                                            grafana ◀────────┴── tempo
#
# The service knows one address — OTEL_EXPORTER_OTLP_ENDPOINT, set in the
# anchor below — and nothing about what is behind it. Swapping Tempo for
# something else is an edit to deploy/otel/collector.yaml, not a redeploy of
# five processes, and that is what the extra hop buys on a laptop where the SDK
# could have written to Tempo directly.
# ---------------------------------------------------------------------------

# Everything both binaries need. The four variables with no default —
# DATABASE_URL, AWS_REGION, OIDC_ISSUER, OIDC_AUDIENCE — are all here, so a
# process that starts at all was configured deliberately.
x-app-environment: &app-environment
  SERVICE_NAME: wagering

  # The service connects as a member of wagering_app, which has no DDL and no
  # UPDATE or DELETE on the ledger. The role is requested at connection time;
  # it does not exist until the migration job has run, which is the second
  # reason — after the tables — that nothing here starts before that job
  # finishes.
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/wagering?sslmode=disable&options=-c%20role%3Dwagering_app

  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  # Half of a pair LocalStack accepts without looking at. Both halves are read
  # by the AWS SDK's credential chain, never by this service, and a deployment
  # sets neither: it uses an instance role instead. The other half is written
  # per service below, as the name of the IAM role that service is meant to
  # run as, so that the identity each queue policy in
  # deploy/localstack/01-queues.sh grants to is visible where the credentials
  # are — LocalStack Community does not enforce the policy, so the name is what
  # there is to read.
  AWS_SECRET_ACCESS_KEY: test
  # Without it the credential chain falls through to the EC2 metadata service,
  # which on a laptop is black-holed rather than refused — five seconds of
  # retries before every client works.
  AWS_EC2_METADATA_DISABLED: "true"

  # Compared with a token's "iss" byte for byte. It is the container address and
  # not the published one because KC_HOSTNAME below pins Keycloak to that
  # spelling whichever interface a request arrived on — so a token fetched from
  # the host through localhost:8080 still says `http://keycloak:8080`, and the
  # one issuer string is true everywhere.
  OIDC_ISSUER: http://keycloak:8080/realms/wagering
  OIDC_AUDIENCE: wagering-api

  # Where spans and measurements go. The scheme is what decides whether the
  # export is encrypted, so `http://` here is plaintext gRPC and not a choice
  # of OTLP over HTTP — the SDK speaks gRPC either way.
  #
  # The service's own default is empty, and empty means nothing is exported at
  # all. This one line is the difference between a stack that is observable and
  # one that could be. .env.example sets the same variable to localhost:4317,
  # which is the same collector seen from the host.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  # Thirty seconds is the default and the right answer for a deployment, where
  # every interval is paid for forever. Here the interval is how long somebody
  # watches a dashboard after submitting a transaction before concluding it
  # does not work. Prometheus scrapes the collector at the same five seconds —
  # see deploy/prometheus/prometheus.yml.
  TELEMETRY_METRIC_INTERVAL: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is what makes this mean "ready for connections" rather than
      # "a postmaster exists". The entrypoint runs initdb and the scripts in
      # docker-entrypoint-initdb.d against a temporary server started with
      # listen_addresses='' — reachable over the unix socket and over nothing
      # else — so a check that went through the socket would pass while the port
      # was still shut, and everything waiting on it would race the database's
      # own initialisation.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "wagering"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pins the issuer, and every URL in the discovery document, to this
      # spelling. Left to itself Keycloak takes the hostname from the request,
      # so a token fetched through the published port would say
      # `http://localhost:8080/realms/wagering` and one fetched from inside the
      # network would say `http://keycloak:8080/realms/wagering` — two issuers
      # for one realm, of which the API can only ever accept the one
      # OIDC_ISSUER names.
      KC_HOSTNAME: http://keycloak:8080
      # The console is the exception: it is opened in a browser on the host,
      # which cannot resolve `keycloak`. Admin traffic is not token traffic, so
      # giving it its own address costs the issuer nothing.
      KC_HOSTNAME_ADMIN: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      # --import-realm reads this directory once at start-up. Read-only: an
      # import that wrote back to the export would make the realm a thing the
      # container mutates rather than a thing the repository states.
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The realm's discovery document, and not Keycloak's own health endpoint.
      # Keycloak reports itself up before it has finished importing, so a check
      # that asked it would let the API start and fail its first JWKS fetch
      # against a realm that does not exist yet. This asks the one question that
      # matters: does /realms/wagering answer. The import takes twelve to
      # fourteen seconds, which start_period covers.
      #
      # It is spoken over bash's /dev/tcp because the image has no HTTP client
      # at all — no curl, no wget — and adding one to an identity provider to
      # check on it is a poor trade.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/wagering/.well-known/openid-configuration HTTP/1.1\r\nHost: keycloak:8080\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  localstack:
    image: localstack/localstack:4
    environment:
      # SQS and nothing else. LocalStack starts what it is asked for, and the
      # rest of it is start-up time this stack never uses.
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      # ready.d runs after the edge service accepts requests — which is to say,
      # after LocalStack has already logged "Ready.".
      - ./deploy/localstack/01-queues.sh:/etc/localstack/init/ready.d/01-queues.sh:ro
    healthcheck:
      # The queues, not the container. LocalStack's own health endpoint is green
      # from the moment the edge service is up, which is before ready.d has run
      # — so a check that asked it would report ready while the queues were
      # still absent, and every process that resolves a queue URL at start-up
      # would fail against a LocalStack that called itself healthy. Asking for
      # the three queue URLs cannot be green until 01-queues.sh has finished
      # creating them.
      test:
        - CMD-SHELL
        - >-
          awslocal sqs get-queue-url --queue-name wager-transactions.fifo > /dev/null &&
          awslocal sqs get-queue-url --queue-name wager-transactions-dlq.fifo > /dev/null &&
          awslocal sqs get-queue-url --queue-name wallet-events.fifo > /dev/null
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 20s

  # The migration job. It applies the schema and exits; everything that needs a
  # schema waits for that exit rather than for a container to be up, which is
  # what service_completed_successfully means and what service_started would
  # not.
  migrate:
    build:
      context: .
      target: migrate
    command: ["up"]
    environment:
      # No `role=wagering_app` here: this connection creates the roles, so it
      # cannot ask to be one of them. It runs as the owner, which is the split
      # docs/schema.md describes.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wagering?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Three replicas of the API, written out three times.
  #
  # `deploy.replicas: 3` would be shorter and would not work: every replica of
  # one service publishes the same host port, so two of the three would fail to
  # bind and the service would never come up. A host port range — "8081-8083:8080"
  # — does bind, but which replica lands on which port is whatever order they
  # started in, and a demonstration that submits to one replica and reads back
  # from another needs to be able to say which is which.
  #
  # So: one anchor and three services that differ in exactly one line. The
  # duplication is three `ports:` entries, and it buys stable names.
  api-1: &api
    build:
      context: .
      target: api
    environment:
      <<: *app-environment
      # The role the queue policies grant the API: resolve and inspect both
      # live queues, for the start-up check and the readiness probe, and send
      # to neither. See the wagering-api statements in
      # deploy/localstack/01-queues.sh.
      AWS_ACCESS_KEY_ID: wagering-api
      # Inside the container nothing else wants 8080, so the API takes it and
      # the host port is what tells the three replicas apart. .env.example moves
      # it to 8081 for the opposite reason: on a laptop Keycloak has 8080.
      HTTP_ADDR: ":8080"
    ports:
      - "8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # Not because the API needs it: a process whose collector refuses
      # connections starts, serves, and logs each failed export. It is the
      # first request after `make up` that this is for — the one a
      # demonstration looks at — and its spans are exactly the ones a collector
      # that is still starting would drop.
      otel-collector:
        condition: service_healthy
    healthcheck:
      # /health/ready, which reports the database and the queue and answers 503
      # when either is unreachable — so this is unhealthy exactly when the
      # replica cannot serve, rather than when it has stopped running.
      #
      # busybox, installed into the image under the name `wget`. Distroless has
      # no HTTP client and Compose can only run a check inside the container it
      # is checking; see the Dockerfile for why it is named the way it is.
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Everything but the published port comes from api-1. A key written here
  # replaces the merged one, which is why `ports` is the only one written.
  api-2:
    <<: *api
    ports:
      - "8082:8080"

  api-3:
    <<: *api
    ports:
      - "8083:8080"

  # Two replicas of the worker. This one can use deploy.replicas, because a
  # worker publishes no port and so has nothing to collide over.
  worker:
    build:
      context: .
      target: worker
    deploy:
      replicas: 2
    environment:
      <<: *app-environment
      # The role the queue policies grant the worker: receive, delete and
      # re-hide on the inbound queue and the dead-letter queue, send to the
      # outbound queue. See the wagering-worker statements in
      # deploy/localstack/01-queues.sh.
      AWS_ACCESS_KEY_ID: wagering-worker
      # Identical across both replicas, deliberately. The inbox holds one row
      # per consumer per message and that row is what turns a redelivery into a
      # replay; a per-replica name would give each replica its own rows and let
      # one message be applied once by each of them.
      CONSUMER_NAME: wager-consumer
      # PUBLISHER_NAME is deliberately absent — the opposite rule, for the
      # opposite reason. It lands in outbox.claimed_by and scopes a reschedule
      # to the publisher holding the row, so two publishers sharing a name put
      # back each other's claims. Unset, the configuration falls back to
      # HOSTNAME, which the container runtime sets to the container's id: a
      # different value in each replica without this file having to invent one.
      # A worker that is running is a worker that found a name, because a
      # process with neither variable set refuses to start.
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # No keycloak. Nothing a worker does is authenticated — a message on the
      # inbound queue was authorised by whatever put it there — so the worker's
      # graph has no identity provider in it and waiting for one would only
      # delay the queues draining.
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  # --- The observability stack ----------------------------------------------
  #
  # Nothing above depends on any of these except through otel-collector, and
  # the collector accepts what it is sent whether or not Tempo and Prometheus
  # are keeping it. Losing the dashboard does not stop a transaction being
  # processed, and none of the four is on the path of one.

  # Built rather than pulled, for one line — see deploy/otel/Dockerfile. The
  # published image is a scratch image with a single binary in it, and a
  # container with no HTTP client in it is a container whose health endpoint
  # nothing can ask; `condition: service_healthy` above could not be written
  # against it.
  otel-collector:
    build:
      context: ./deploy/otel
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # Published so that a process started from the host — `go run ./cmd/api`
      # with .env.example — exports to the same collector the containers do,
      # and so that a hand-written OTLP payload can be posted to 4318.
      - "4317:4317"
      - "4318:4318"
    depends_on:
      # So that the first batch the collector forwards has somewhere to land.
      # It would retry if it did not, but a retry that succeeds is still a log
      # line that says something failed, on a stack whose logs are read.
      tempo:
        condition: service_healthy
    healthcheck:
      # The health_check extension, which answers 200 once every pipeline has
      # started — so this is "the receivers are listening" and not "a process
      # exists". busybox, installed into the image under the name `wget`; see
      # deploy/otel/Dockerfile for why it is named that.
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      # The blocks and the write-ahead log. A named volume rather than the
      # container filesystem so that `docker compose restart tempo` keeps the
      # traces, and `docker compose down -v` is still the one command that
      # forgets everything. /var/tempo exists in the image owned by the user
      # Tempo runs as, which is what a fresh volume inherits.
      - tempo-data:/var/tempo
    ports:
      # The API the Grafana datasource talks to, published because it is also
      # the API that answers "find me the trace with this correlationId" from a
      # shell. See `make trace`.
      - "3200:3200"
    healthcheck:
      # /ready, not /status: Tempo answers /status while it is still replaying
      # its write-ahead log, and a collector that started against that one
      # would spend its first seconds retrying.
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.9.0
    # No command. The image's default already names
    # /etc/prometheus/prometheus.yml and /prometheus, and overriding it to say
    # one flag means restating the rest — including the storage path, whose
    # absence is a Prometheus that quietly writes its database into the working
    # directory.
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      # /-/ready rather than /-/healthy: healthy means the process is up, ready
      # means the database is loaded and it can answer a query — which is what
      # Grafana is about to do.
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      # Placeholders, and they could not be anything else: they are printed by
      # `make dashboards` and written in .env.example, both of which are in the
      # repository. Nothing in this stack is reachable from anywhere but the
      # laptop it runs on.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # A viewer needs no account at all, so `make up` and then opening
      # localhost:3000 lands on the dashboard rather than on a login form. The
      # credentials above are what anything that writes still has to present.
      # This is a posture for a laptop and for nothing else.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Grafana phones home for usage statistics and for the latest version
      # unless told not to. A stack brought up by a `make` target has no
      # business making either call on the developer's behalf.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # The datasources and the dashboard provider. Grafana reads these
      # directories once at start-up, which is what "already loaded" means.
      #
      # Two mounts, one per directory, rather than one over
      # /etc/grafana/provisioning. That directory holds six of these in the
      # image — alerting, plugins, notifiers and access-control besides these
      # two — and a single mount hides the four this repository has nothing to
      # say about, leaving Grafana to log a failure for each on every start.
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # The dashboards themselves, one directory over from the provider that
      # points at them — see deploy/grafana/provisioning/dashboards.
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      # Grafana's own database: users, preferences, the provisioning bookkeeping
      # that tells it this dashboard is the file's and not the UI's.
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      # Generous, because Grafana is: it answers this endpoint roughly forty
      # seconds after it starts, against a few seconds for everything else
      # here. start_period is what keeps those forty seconds from counting as
      # ten failures — during it a failing check leaves the container
      # `starting`, and `docker compose up --wait` goes on waiting rather than
      # calling a slow start a broken one.
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  postgres-data:
  tempo-data:
  prometheus-data:
  grafana-data:
