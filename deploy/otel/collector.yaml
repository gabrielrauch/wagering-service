# The one address every process in this stack exports to.
#
# The service speaks OTLP and knows nothing else — not that Tempo holds the
# traces, not that Prometheus scrapes the metrics. Moving either is an edit to
# this file and a restart of one container, rather than a redeploy of the API
# and the worker. That is worth a hop even on a laptop, where the SDK could
# have written to Tempo directly.

receivers:
  otlp:
    protocols:
      # gRPC is what the service uses: OTEL_EXPORTER_OTLP_ENDPOINT is read by
      # otlptracegrpc and otlpmetricgrpc, and `http://` in that URL means
      # plaintext gRPC rather than OTLP/HTTP. The HTTP receiver is here for
      # everything else — a curl, a one-off script — that would rather POST
      # JSON than speak gRPC, and costs a listener.
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  # No tail sampler, which is the one decision this file is expected to make and
  # does not. The service records every trace it starts and says why in the
  # package documentation of internal/fxmod.Telemetry: a head sampler throws
  # away the traces an operator most wants, because whether a trace is
  # interesting is known at its END, and the collector is where an end-of-trace
  # rule belongs.
  #
  # This stack keeps all of it, and for a laptop that is the right answer twice
  # over: the volume is one developer's traffic, and the trace somebody is
  # demonstrating is never the one a rule would have kept. A deployment adds
  # tail_sampling here — and the number it is bounding, eight hundred thousand
  # spans a day from one idle worker replica, is in that same documentation.

  # One second, which is short for a collector and deliberate here: this stack
  # exists to be watched while somebody submits a transaction by hand, and a
  # batch that waits for the usual five or ten seconds is a dashboard that
  # looks broken for as long as it takes to wonder whether it is.
  batch: {timeout: 1s}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    # Plaintext, because both ends of this hop are containers on one compose
    # network that nothing outside can address. A deployment terminates TLS
    # here; this file is not that deployment and says so rather than carrying a
    # certificate nobody verifies.
    tls: {insecure: true}
  prometheus:
    # Pull, not remote write. Prometheus scrapes this endpoint (see
    # deploy/prometheus/prometheus.yml), so a Prometheus that was down comes
    # back to a collector that is still exporting rather than to a gap it can
    # never be sent again.
    endpoint: 0.0.0.0:8889
    # Without this the resource attributes stay on their own `target_info`
    # series and never reach the measurements, so `service.name` — the label
    # the dashboard selects a service on — is missing from every series the
    # dashboard queries.
    resource_to_telemetry_conversion: {enabled: true}

extensions:
  # What the container's healthcheck asks, and the reason the image this runs
  # from carries a wget at all. It answers 200 once every pipeline below has
  # started, so `service_healthy` means "the receivers are listening" rather
  # than "a process exists".
  health_check: {endpoint: 0.0.0.0:13133}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
